<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>家具批量入库</title>
  <style>
    :root{color-scheme:light;--bg:#f6f7f9;--card:#fff;--line:#e5e8ed;--text:#20242c;--muted:#747c89;--primary:#5c5577;--primary-bg:#f1f0f5}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--text);font:13px/1.5 "Microsoft YaHei","Segoe UI",sans-serif}
    button,input,select{font:inherit}button{cursor:pointer}button:disabled,input:disabled,select:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}
    .app{height:100%;display:flex;flex-direction:column}.header{flex:none;padding:14px 16px 12px;background:#fff;border-bottom:1px solid var(--line)}
    .head-row{display:flex;align-items:center;gap:10px}.logo{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#343842;color:#fff;font-weight:700}.heading{flex:1;min-width:0}h1{font-size:16px;margin:0}.hint{margin:6px 0 0;color:var(--muted);font-size:12px}
    .btn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);white-space:nowrap}.btn:hover:enabled{background:#f7f8fa;border-color:#c8cbd2}.btn.primary{background:#4e4a60;border-color:#4e4a60;color:#fff;font-weight:650}.btn.primary:hover:enabled{background:#403c50}.btn.add{color:var(--primary);background:var(--primary-bg);border-color:#e4e1e9}.btn.add[aria-pressed="true"]{color:#267044;background:#eef9f0;border-color:#9bcaa4}
    button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #aaa5b7;outline-offset:2px}
    .bulk{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:11px 16px 0}.bulk-title{color:#56516c;font-size:12px;font-weight:650}.bulk label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.bulk select{width:116px}.bulk-note{font-size:11px;color:var(--muted)}
    select,input{min-width:0;max-width:100%;width:100%;height:32px;padding:0 8px;border:1px solid #dfe3e9;border-radius:7px;background:#fff;color:var(--text)}
    .pick-hint{flex:none;margin:10px 16px 0;padding:7px 10px;border:1px solid #c5dfcc;border-radius:7px;background:#eef9f0;color:#267044;font-size:12px}
    .scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px 16px 16px;scrollbar-gutter:stable}
    #rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:12px;align-content:start}
    .card{position:relative;display:grid;grid-template-columns:124px minmax(0,1fr);gap:12px;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;align-items:start}
    .thumb-frame{width:120px;height:120px;cursor:zoom-in;overflow:hidden;border:1px solid #e7eaef;border-radius:8px;background:#fff;display:grid;place-items:center}.thumb{display:block;width:100%;height:100%;object-fit:contain;background:#fff}.fields{min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fields label{display:flex;flex-direction:column;gap:4px;min-width:0;color:var(--muted);font-size:11px}.fields input,.fields select{font-size:12px}.wide{grid-column:1/-1}.rowhead{min-height:22px;padding-right:22px}.badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;color:#5c5577;background:#f1f0f5}.badge.update{color:#946200;background:#fff6df}.badge.repair{color:#347186;background:#edf6fa}.mode{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:5px;font-size:10px;color:#267044;background:#eef9f0;border:1px solid #d9eadc}.qty{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:5px;font-size:10px;color:#394150;background:#eef1f5;border:1px solid #dfe4ea;font-weight:650}
    .remove{position:absolute;top:9px;right:9px;display:grid;place-items:center;width:24px;height:24px;padding:0;border:0;border-radius:50%;background:transparent;color:#9199a5;font-size:19px;line-height:1}.remove:hover:enabled{background:#fff0ef;color:#b42318}.readonly-name{font-size:13px;font-weight:650;overflow-wrap:anywhere}.readonly-category{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.note{font-size:11px;color:var(--muted)}
    .empty{grid-column:1/-1;text-align:center;padding:52px 18px;border:1px dashed #d6dae2;border-radius:10px;background:#fff;color:var(--muted)}.empty strong{display:block;color:#56516c;font-weight:650;margin-bottom:6px}
    .footer{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line);background:#fff}.summary{min-width:0}.count{font-size:12px;color:#56516c}.status{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.status.error{color:#b42318}.actions{display:flex;gap:8px;flex:none}
    @media(max-width:480px){.header{padding:12px}.bulk{padding:10px 12px 0}.bulk-note{width:100%}.scroll{padding:10px 12px}.pick-hint{margin:10px 12px 0}.card{grid-template-columns:86px minmax(0,1fr);padding:10px;gap:8px}.thumb-frame{width:82px;height:82px}.footer{padding:10px 12px;gap:8px}.btn{padding:0 10px}}
    .preview-status{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5;overflow-wrap:anywhere}.thumb-column{min-width:0}.thumb-frame:focus-visible{outline:2px solid #aaa5b7;outline-offset:2px}
    .preview-overlay{position:fixed;inset:0;z-index:100;background:#20242cb8;display:flex;align-items:center;justify-content:center;padding:24px}.preview-box{position:relative;width:min(620px,94vw);max-height:94vh;padding:16px;background:#fff;border-radius:12px;box-shadow:0 18px 70px #0005}.preview-box img{display:block;width:100%;height:min(65vh,560px);object-fit:contain;background:#fff}.preview-caption{font-size:14px;font-weight:650;overflow-wrap:anywhere;padding-right:60px}.preview-help{font-size:11px;color:var(--muted);margin-top:5px}.preview-close{position:absolute;right:12px;top:10px}
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="head-row"><div class="logo" aria-hidden="true">库</div><div class="heading"><h1>家具批量入库</h1></div><button class="btn add" id="add" aria-pressed="false">＋ 加选</button></div>
    <p class="hint">入库统一以真模型为准。即使当前选中的是代理，也会先切回真模型，再做重新入库、更新或校验。</p>
  </header>
  <div class="bulk"><span class="bulk-title">批量分类</span><label>大类<select id="bulkCat"></select></label><label>子类<select id="bulkSub"></select></label><span class="bulk-note">选择即应用于全部新家具</span></div>
  <div class="pick-hint" id="pickHint" hidden>移到组件／群组上预选，单击立即加入，可连续点选。Esc 退出加选。</div>
  <main class="scroll" id="scroll"><div id="rows"></div></main>
  <footer class="footer"><div class="summary"><div class="count" id="count"></div><div class="status" id="status" role="status" aria-live="polite">确认分类和名称后开始入库</div></div><div class="actions"><button class="btn" id="close">关闭</button><button class="btn primary" id="submit">开始入库</button></div></footer>
</div>
<div class="preview-overlay" id="previewOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="previewCaption"><div class="preview-box"><button class="btn preview-close" id="previewClose">关闭</button><div class="preview-caption" id="previewCaption"></div><img id="previewLargeImage" alt="家具放大预览"><div class="preview-help">纹理着色＋可见边线；不显示背面边线，不改变项目样式。特殊继承贴图可能采用默认投影；Esc 关闭。</div></div></div>
<script>
  const CATS=__CATS__, SUBS=__SUBS__;
  let rows=__ROWS__, adding=false, submitting=false, bulkDefault=null;
  const removed=new Set(), $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function call(name,...args){try{if(!window.sketchup||typeof sketchup[name]!=='function')throw new Error('尚未连接 SketchUp，请重新打开面板');sketchup[name](...args);return true}catch(e){showStatus(e.message,true);return false}}
  function showStatus(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
  function fillSelect(el,opts,value,mixed=false){el.innerHTML='';if(mixed){const o=new Option('多种分类','');o.disabled=true;o.selected=true;el.add(o)}const values=opts.slice();if(value&&!values.includes(value))values.push(value);values.forEach(v=>el.add(new Option(v,v,false,!mixed&&v===value)))}
  function syncBulk(){const fresh=rows.filter(r=>!r.managed),first=fresh[0]||bulkDefault||{category:CATS[0],subcategory:(SUBS[CATS[0]]||['其他'])[0]};const mixedCat=fresh.some(r=>r.category!==first.category),mixedSub=mixedCat||fresh.some(r=>r.subcategory!==first.subcategory);fillSelect($('bulkCat'),CATS,first.category,mixedCat);fillSelect($('bulkSub'),SUBS[first.category]||['其他'],first.subcategory,mixedSub);$('bulkSub').disabled=submitting||mixedCat}
  function refreshControls(){document.querySelectorAll('button,input,select').forEach(el=>el.disabled=submitting);$('submit').disabled=submitting||!rows.length;$('submit').textContent=submitting?'正在提交…':'开始入库';$('add').disabled=submitting||adding;$('bulkSub').disabled=submitting||!$('bulkCat').value;const counts={new:0,update:0,repair:0},instances=rows.reduce((n,r)=>n+Math.max(1,Number(r.quantity||1)),0);rows.forEach(r=>counts[r.action]=(counts[r.action]||0)+1);$('count').textContent=`共 ${rows.length} 款 / ${instances} 件`+(rows.length?' · '+[['new','真模型新入库'],['update','真模型更新'],['repair','真模型校验']].filter(([k])=>counts[k]).map(([k,v])=>`${v} ${counts[k]}`).join(' · '):'')}
  function makeCard(r){const card=document.createElement('article');card.className='card';card.dataset.key=r.key;const badge=r.action==='update'?'更新 / 校验':r.action==='repair'?'校验':'新入库',qty=Math.max(1,Number(r.quantity||1));const mode=(r.display_representation||'full')==='full'?'真模型':'真模型';card.innerHTML=`<button class="remove" title="从本次入库中移除" aria-label="移除 ${esc(r.name)}">×</button><div class="thumb-column"><div class="thumb-frame" title="点击放大轴测预览" role="button" tabindex="0" aria-label="放大 ${esc(r.name)} 预览"><img class="thumb" alt="${esc(r.name)}真模型轴测预览"></div><div class="preview-status">${esc(r.preview_status||'轴测预览加载中')}</div></div><div class="fields"><div class="rowhead wide"><span class="badge ${r.action==='update'?'update':r.action==='repair'?'repair':''}">${badge}</span><span class="mode">${mode}</span>${qty>1?`<span class="qty">×${qty}</span>`:''}</div>${r.managed?`<div class="readonly-name wide">${esc(r.name)}</div><div class="readonly-category wide">${esc(r.category)} / ${esc(r.subcategory)}</div><div class="note wide">${esc(r.note||'真模型 · 更新 / 校验源模型')}</div>`:`<label>大类<select data-cat></select></label><label>子类<select data-sub></select></label><label class="wide">名称<input data-name autocomplete="off" required></label><div class="note wide">${esc(r.note||('真模型 · 新家具独立入库'+(r.source_label?' · 来源：'+r.source_label:'')))}</div>`}</div>`;const frame=card.querySelector('.thumb-frame');frame.addEventListener('click',()=>window.openIngestPreview(r.key));frame.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();window.openIngestPreview(r.key)}});const img=card.querySelector('img');img.src=r.thumbnail_url;img.addEventListener('error',()=>{img.alt='真模型轴测缩略图暂不可用'},{once:true});if(!r.managed){const cat=card.querySelector('[data-cat]'),sub=card.querySelector('[data-sub]'),name=card.querySelector('[data-name]');if(r.name_auto===undefined)r.name_auto=true;fillSelect(cat,CATS,r.category);fillSelect(sub,SUBS[r.category]||['其他'],r.subcategory);name.value=r.name;const syncAutoName=()=>{if(r.name_auto!==false){r.name=r.subcategory||'';name.value=r.name;name.setCustomValidity('')}};cat.addEventListener('change',()=>{r.category=cat.value;r.subcategory=(SUBS[r.category]||['其他'])[0];fillSelect(sub,SUBS[r.category]||['其他'],r.subcategory);syncAutoName();syncBulk()});sub.addEventListener('change',()=>{r.subcategory=sub.value;syncAutoName();syncBulk()});name.addEventListener('input',()=>{r.name=name.value;r.name_auto=false;name.setCustomValidity('')})}card.querySelector('.remove').addEventListener('click',()=>{if(submitting)return;if(!call('soft_batch_ingest_remove',r.key))return;removed.add(r.key);rows=rows.filter(x=>x.key!==r.key);card.remove();if(!rows.length)render();else{syncBulk();refreshControls()}showStatus('已从本次入库移除，模型中的对象保留')});return card}
  function render(){const host=$('rows'),scroll=$('scroll').scrollTop;host.innerHTML='';if(!rows.length)host.innerHTML='<div class="empty"><strong>还没有待入库的家具</strong>点击右上角“＋ 加选”，再到模型中点选组件或群组。</div>';else rows.forEach(r=>host.appendChild(makeCard(r)));syncBulk();refreshControls();$('scroll').scrollTop=scroll}
  function applyBulk(){const category=$('bulkCat').value,subcategory=$('bulkSub').value;if(!category||!subcategory)return;bulkDefault={category,subcategory};rows.forEach(r=>{if(!r.managed){Object.assign(r,bulkDefault);if(r.name_auto!==false)r.name=subcategory}});render();showStatus('分类已应用于全部新家具；未手改的名称已自动跟随子类')}
  $('bulkCat').addEventListener('change',()=>{const opts=SUBS[$('bulkCat').value]||['其他'];fillSelect($('bulkSub'),opts,opts[0]);applyBulk()});$('bulkSub').addEventListener('change',applyBulk);
  $('add').addEventListener('click',()=>{if(adding||submitting)return;setAdding(true);if(!call('soft_batch_ingest_add_selection'))setAdding(false)});
  $('close').addEventListener('click',()=>{if(!submitting)call('soft_batch_ingest_close')});
  $('submit').addEventListener('click',()=>{if(submitting||!rows.length)return;const invalid=rows.find(r=>!r.managed&&!String(r.name).trim());if(invalid){const card=Array.from($('rows').children).find(c=>c.dataset.key===invalid.key),input=card.querySelector('[data-name]');input.setCustomValidity('请输入家具名称');input.reportValidity();input.focus();showStatus('请填写新家具名称',true);return}setSubmitting(true);if(!call('soft_batch_ingest_submit',JSON.stringify({rows:rows.map(({key,name,category,subcategory})=>({key,name,category,subcategory}))})))setSubmitting(false)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&adding&&!submitting){e.preventDefault();call('soft_batch_ingest_stop_add_selection')}});
  window.setAdding=function(value){adding=!!value;$('add').textContent=adding?'正在加选…':'＋ 加选';$('add').setAttribute('aria-pressed',String(adding));$('pickHint').hidden=!adding;refreshControls()};
  window.setSubmitting=function(value,error){submitting=!!value;refreshControls();if(error)showStatus(error,true)};
  // Only append the clicked card. Existing inputs, focus, edits and removed cards stay intact.
  window.appendRow=function(row){if(submitting||!row||!row.key)return;const existing=rows.find(r=>r.key===row.key);if(existing){existing.quantity=Math.max(Number(existing.quantity||1),Number(row.quantity||1));existing.note=row.note||existing.note;const card=Array.from($('rows').children).find(c=>c.dataset.key===row.key),qty=card&&card.querySelector('.qty');if(card){if(existing.quantity>1){if(qty)qty.textContent='×'+existing.quantity;else{const span=document.createElement('span');span.className='qty';span.textContent='×'+existing.quantity;card.querySelector('.rowhead').appendChild(span)}}}refreshControls();showStatus(`已合并同款 · ${existing.source_label||existing.name} ×${existing.quantity}`);return}removed.delete(row.key);if(!row.managed&&bulkDefault){Object.assign(row,bulkDefault);if(row.name_auto!==false)row.name=bulkDefault.subcategory}if(!rows.length)$('rows').innerHTML='';rows.push(row);$('rows').appendChild(makeCard(row));syncBulk();refreshControls();showStatus(`已加入 · ${row.source_label||row.name}`)};
  window.setRows=function(incoming){(incoming||[]).forEach(r=>{if(!removed.has(r.key)&&!rows.some(x=>x.key===r.key))appendRow(r)});refreshControls()};
  window.updateThumb=function(key,url){const r=rows.find(x=>x.key===key);if(!r)return;r.thumbnail_url=url;const card=Array.from($('rows').children).find(c=>c.dataset.key===key);if(card)card.querySelector('img').src=url};
  /*__INGEST_PREVIEW_JS__*/
  render();call('soft_batch_ingest_ready');
</script>
</body>
</html>
