<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>材质库</title>
<style>
  :root{--accent:#ad7547;--accent-soft:#f6eee7;--text:#26313d;--muted:#7d8792;--line:#e6e9ee;--bg:#f4f6f8;--shadow:0 8px 24px rgba(39,49,61,.09)}
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text)}
  button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 9px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
  .title{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;position:relative}.logo:before,.logo:after{content:"";position:absolute;border:2px solid var(--accent);border-radius:4px;width:13px;height:13px}.logo:before{left:7px;top:7px}.logo:after{right:6px;bottom:6px;background:rgba(255,255,255,.45)}h1{font-size:16px;margin:0;white-space:nowrap}.sub{font-size:10px;color:var(--muted);margin-top:2px}.badge{padding:5px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:800;white-space:nowrap}
  .path-row{padding:9px 14px;display:flex;gap:8px;align-items:center;background:#fff;border-bottom:1px solid var(--line)}.path{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#6c7580;font-size:11px}.btn{height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#44505d;padding:0 11px;cursor:pointer}.btn:hover{border-color:var(--accent);color:var(--accent)}
  .content{min-height:0;display:grid;grid-template-columns:180px minmax(0,1fr);gap:10px;padding:10px 14px 12px}.folders,.main{min-height:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.folders{overflow:auto;padding:7px}.folder-title{padding:5px 7px 7px;color:#929aa5;font-size:10px;font-weight:800;letter-spacing:.08em}.folder{width:100%;height:31px;border:0;border-radius:7px;background:transparent;text-align:left;padding:0 9px;color:#4d5865;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folder:hover{background:#f3f5f7}.folder.active{background:var(--accent-soft);color:var(--accent);font-weight:800}
  .main{display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}.tools{padding:9px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.search{flex:1;min-width:120px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}.count{font-size:11px;color:var(--muted);white-space:nowrap}.grid{min-height:0;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));grid-auto-rows:max-content;gap:10px;align-content:start}.card{position:relative;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;transition:.15s}.card:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(39,49,61,.12);border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}.swatch{aspect-ratio:1/1;background:#eceff2;display:grid;place-items:center;overflow:hidden}.swatch img{width:100%;height:100%;object-fit:cover;image-rendering:auto}.name{padding:8px 9px 2px;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{padding:0 9px 9px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hover{position:absolute;inset:0;background:linear-gradient(to top,rgba(18,24,31,.64),rgba(18,24,31,0) 55%);display:flex;align-items:flex-end;justify-content:center;padding:11px;opacity:0;transition:.14s}.card:hover .hover{opacity:1}.use{height:31px;border:0;border-radius:8px;background:rgba(255,255,255,.94);color:var(--accent);font-weight:800;padding:0 13px;cursor:pointer}.use:disabled{color:#a7adb5;cursor:not-allowed}.empty{grid-column:1/-1;min-height:240px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:28px}.empty strong{display:block;color:var(--text);font-size:14px;margin-bottom:5px}
  .footer{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 14px;background:#fff;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.status{font-weight:800}.status.ok{color:var(--accent)}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#172033;color:#fff;border-radius:9px;padding:9px 13px;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:.15s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#8f231b}
  .more{grid-column:1/-1;display:flex;justify-content:center;padding:8px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="title"><div class="logo"></div><div><h1 id="title">材质库</h1><div class="sub" id="version"></div></div></div><div class="badge" id="discipline">工作区</div></div>
  <div class="path-row"><div class="path" id="path">材质库：未设置</div><button class="btn" id="choose">设置目录</button><button class="btn" id="refresh">刷新</button></div>
  <div class="content"><div class="folders" id="folders"></div><div class="main"><div class="tools"><input class="search" id="search" placeholder="搜索材质名称或分类"><div class="count" id="count"></div></div><div class="grid" id="grid"></div></div></div>
  <div class="footer"><span id="hint">可浏览材质库。</span><span class="status" id="status"></span></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var state={materials:[],library_ready:false,can_use:false},activeFolder='',query='',visibleLimit=72,searchTimer=null;
  var folders=document.getElementById('folders'),grid=document.getElementById('grid'),count=document.getElementById('count'),toast=document.getElementById('toast');
  function call(name){var args=[].slice.call(arguments,1);if(window.sketchup&&typeof window.sketchup[name]==='function')window.sketchup[name].apply(window.sketchup,args);}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function uniqueFolders(){var map={'':true};(state.materials||[]).forEach(function(m){var f=m.folder||'';if(f)map[f]=true;});return Object.keys(map).sort(function(a,b){if(!a)return -1;if(!b)return 1;return a.localeCompare(b,'zh-CN',{numeric:true});});}
  function visibleMaterials(){var q=query.trim().toLowerCase();return (state.materials||[]).filter(function(m){var folder=m.folder||'';if(activeFolder&&!(folder===activeFolder||folder.indexOf(activeFolder+'/')===0))return false;if(!q)return true;return ((m.name||'')+' '+folder).toLowerCase().indexOf(q)>=0;});}
  function renderFolders(){var rows=uniqueFolders();if(activeFolder&&rows.indexOf(activeFolder)<0)activeFolder='';folders.innerHTML='<div class="folder-title">材质分类</div>'+rows.map(function(f){var label=f||'全部材质';return '<button class="folder '+(f===activeFolder?'active':'')+'" data-folder="'+esc(f)+'" title="'+esc(label)+'">'+esc(label)+'</button>';}).join('');folders.querySelectorAll('[data-folder]').forEach(function(btn){btn.addEventListener('click',function(){activeFolder=btn.getAttribute('data-folder')||'';visibleLimit=72;grid.scrollTop=0;renderFolders();renderGrid(false);});});}
  function renderGrid(keepScroll){var oldTop=keepScroll?grid.scrollTop:0,rows=visibleMaterials(),shown=rows.slice(0,visibleLimit);count.textContent=(shown.length<rows.length?shown.length+' / '+rows.length:rows.length)+' 个材质';if(!state.library_ready){grid.innerHTML='<div class="empty"><div><strong>尚未设置材质库</strong>点击“设置目录”，选择材质 PNG 的存放文件夹。</div></div>';return;}if(!rows.length){grid.innerHTML='<div class="empty"><div><strong>没有找到材质</strong>可使用顶部吸管选中一个有材质的面并入库。</div></div>';return;}var actionLabel=state.selected_face_count>0?'应用到已选面':'启用油漆桶',html=shown.map(function(m){return '<div class="card"><div class="swatch"><img loading="lazy" src="'+esc(m.preview_url||'')+'" alt=""></div><div class="name" title="'+esc(m.name)+'">'+esc(m.name)+'</div><div class="meta" title="'+esc(m.folder||'未分类')+'">'+esc(m.folder||'未分类')+(m.textured===false?' · 纯色':' · 纹理')+'</div><div class="hover"><button class="use" data-use="'+esc(m.id)+'" '+(state.can_use?'':'disabled')+'>'+esc(state.can_use?actionLabel:'进入本专业编辑后使用')+'</button></div></div>';}).join('');if(shown.length<rows.length)html+='<div class="more"><button class="btn" data-more="1">继续加载 '+Math.min(48,rows.length-shown.length)+' 个</button></div>';grid.innerHTML=html;if(keepScroll)grid.scrollTop=oldTop;}
  function applyTheme(){var c=state.theme_color||'#ad7547',soft=state.theme_soft||'#f6eee7';document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--accent-soft',soft);}
  function render(){applyTheme();document.getElementById('title').textContent=(state.discipline_name||'')+'材质库';document.getElementById('version').textContent='SU LinkHub v'+(state.plugin_version||'0.9.87');document.getElementById('discipline').textContent=(state.discipline_name||'')+'工作区';var root=state.library_root||'',path=document.getElementById('path');path.textContent=root?'材质库：'+root:'材质库：未设置';path.title=root;document.getElementById('hint').textContent=state.context_message||'可浏览材质库。';document.getElementById('status').textContent=state.can_use?(state.selected_face_count>0?'可直接应用':'可启用油漆桶'):'只读浏览';document.getElementById('status').className='status '+(state.can_use?'ok':'');renderFolders();renderGrid();}
  document.getElementById('choose').addEventListener('click',function(){call('choose_library');});document.getElementById('refresh').addEventListener('click',function(){call('refresh_library');});document.getElementById('search').addEventListener('input',function(e){query=e.target.value||'';clearTimeout(searchTimer);searchTimer=setTimeout(function(){visibleLimit=72;grid.scrollTop=0;renderGrid(false);},120);});
  grid.addEventListener('click',function(e){var more=e.target.closest('[data-more]');if(more){visibleLimit+=48;renderGrid(true);return;}var use=e.target.closest('[data-use]');if(use&&state.can_use&&!use.disabled)call('use_material',use.getAttribute('data-use'));});grid.addEventListener('scroll',function(){if(grid.scrollTop+grid.clientHeight>grid.scrollHeight-160&&visibleLimit<visibleMaterials().length){visibleLimit+=48;renderGrid(true);}});
  window.MaterialLibrary={receiveState:function(payload){state=payload||state;state.materials=Array.isArray(state.materials)?state.materials:[];visibleLimit=72;render();},showToast:function(payload){payload=payload||{};toast.textContent=payload.message||'';toast.className='toast '+(payload.level==='error'?'error':'')+' show';clearTimeout(window.__mt);window.__mt=setTimeout(function(){toast.className='toast';},2200);}};
  call('ready');
})();
</script>
</body>
</html>
