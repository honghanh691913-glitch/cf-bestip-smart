<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>建筑库</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--line:#dce4ef;--text:#243044;--muted:#6f7b8f;--accent:#3a6fb2;--soft:#edf4fc;--shadow:0 8px 24px rgba(42,73,116,.10);--card-size:184px}*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 "Microsoft YaHei",Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden}.header{padding:12px 15px;background:#fff;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px;border-radius:11px;background:linear-gradient(145deg,#5889ca,var(--accent));display:grid;place-items:center;color:#fff;font-size:17px;box-shadow:0 5px 14px rgba(58,111,178,.25)}.title h1{margin:0;font-size:16px}.pill{font-size:11px;color:var(--accent);font-weight:800;background:var(--soft);padding:4px 9px;border-radius:999px}.path-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin-top:10px}.path{min-width:0;border:1px dashed #cbd6e5;border-radius:9px;padding:7px 9px;background:#fbfcfe;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.btn{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:7px 10px}.btn:hover{border-color:#a8bfde;background:#fbfdff}.tabs{display:flex;gap:4px;padding:8px 14px 0;background:#fff;border-bottom:1px solid var(--line)}.tab{border:0;border-bottom:3px solid transparent;background:transparent;padding:8px 14px;color:var(--muted);font-weight:800}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.content{min-height:0;overflow:hidden}.pane{display:none;height:100%;min-height:0}.pane.active{display:grid;grid-template-rows:auto minmax(0,1fr)}.placeholder-pane.active,.schedule-pane.active{display:block;overflow:auto;padding:14px}.tools{padding:10px 14px;display:flex;gap:8px;align-items:center;background:#fff}.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}.search:focus{border-color:#8eafd7;box-shadow:0 0 0 3px rgba(58,111,178,.10)}.count{color:var(--muted);font-size:11px}.shell{min-height:0;display:grid;grid-template-columns:180px minmax(0,1fr);gap:10px;padding:0 14px 12px;overflow:hidden}.folders{min-height:0;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px}.folder-title{padding:5px 7px 8px;color:#8490a2;font-size:10px;font-weight:800;letter-spacing:.08em}.folder-btn{width:100%;height:32px;border:0;border-radius:7px;background:transparent;color:#46556d;display:flex;align-items:center;gap:7px;text-align:left;padding:0 8px}.folder-btn:hover{background:#f1f5fb}.folder-btn.active{background:var(--soft);color:var(--accent);font-weight:800}.folder-name{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folder-count{font-size:10px;color:#95a1b3}.quick-group{border-bottom:1px solid #e8edf4;margin-bottom:5px;padding-bottom:5px}.folder-btn.quick span:first-child{color:var(--accent);font-size:14px}.scroll{min-height:0;overflow:auto;padding:1px 4px 10px 1px}.grid{display:grid;grid-template-columns:repeat(auto-fill,var(--card-size));gap:10px;align-content:start}.card{position:relative;width:var(--card-size);aspect-ratio:1/1;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;transition:.14s}.card:hover{border-color:#9fb9dc;box-shadow:var(--shadow);transform:translateY(-1px)}.swatch{position:absolute;inset:0;background:#f2f5f9;display:grid;place-items:center}.swatch img{width:100%;height:100%;object-fit:contain}.name{position:absolute;z-index:2;left:8px;top:8px;max-width:calc(100% - 50px);padding:4px 7px;border-radius:7px;background:rgba(32,48,70,.66);color:#fff;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.star{position:absolute;z-index:5;right:8px;top:8px;width:28px;height:28px;border:1px solid rgba(255,255,255,.72);border-radius:999px;background:rgba(35,53,78,.58);color:#fff;display:grid;place-items:center;font-size:16px;opacity:0;transition:.14s}.card:hover .star,.star.favorite,.mini .star{opacity:1}.star.favorite,.star:hover{background:rgba(58,111,178,.94);color:#ffe66d}.mini .star{right:5px;top:5px}.hover{position:absolute;z-index:3;inset:0;display:flex;align-items:flex-end;padding:10px;background:linear-gradient(to bottom,rgba(20,30,45,0) 40%,rgba(24,39,61,.72) 100%);opacity:0;pointer-events:none}.card:hover .hover{opacity:1;pointer-events:auto}.hover .btn{width:100%;background:rgba(255,255,255,.94);font-weight:800;color:var(--accent)}.empty,.hero{padding:46px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px}.hero strong,.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px}.schedule-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}.schedule-card h3{margin:0 0 10px;font-size:14px}.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:7px;padding:6px 0;border-bottom:1px dashed #e5eaf1}.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{overflow-wrap:anywhere}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:#fff;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.status.ok{color:var(--accent);font-weight:800}.toast{position:fixed;right:16px;bottom:48px;max-width:360px;padding:10px 12px;border-radius:9px;background:#27364c;color:#fff;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(7px);transition:.16s}.toast.show{opacity:1;transform:translateY(0)}
</style></head><body>
<div class="app"><div class="header"><div class="top"><div class="title"><div class="logo">⌂</div><div><h1>建筑库</h1><div id="version" style="font-size:10px;color:#8793a4"></div></div></div><div class="pill">建筑工作区</div></div><div class="path-row"><div class="path" id="path">建筑模型库：暂未启用</div><button class="btn" id="choose">设置目录</button><button class="btn" id="refresh">刷新</button></div></div><nav class="tabs"><button class="tab active" data-tab="model">建筑模型库</button><button class="tab" data-tab="material">建筑材质库</button><button class="tab" data-tab="schedule">建筑清单</button></nav><main class="content"><section class="pane placeholder-pane active" id="modelPane"><div class="hero"><strong>建筑模型库暂未启用</strong>当前版本先统一保留建筑模型库入口与页面结构。建筑专业继续通过协同 FULL 模型发布和获取；后续需要标准构件库时可直接在本页扩展。</div></section><section class="pane" id="materialPane"><div class="tools"><input class="search" id="materialSearch" placeholder="搜索建筑材质或分类…"><span class="count" id="materialCount">0 个材质</span></div><div class="shell"><div class="folders" id="materialFolders"></div><div class="scroll"><div class="grid" id="materialGrid"></div></div></div></section><section class="pane schedule-pane" id="schedulePane"><div id="scheduleContent"></div></section></main><div class="footer"><span id="hint">建筑模型库暂未启用；可切换到建筑材质库。</span><span class="status" id="status">统一入口</span></div></div><div class="toast" id="toast"></div>
<script>
(function(){var state={material_library:{materials:[]},schedule:{}},tab='model',folder='',loaded=false;var q=function(id){return document.getElementById(id)},grid=q('materialGrid'),folders=q('materialFolders'),search=q('materialSearch'),toast=q('toast');function call(n,a){try{if(window.sketchup&&typeof window.sketchup[n]==='function'){a===undefined?window.sketchup[n]():window.sketchup[n](a);return true}}catch(e){}return false}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function showToast(m){toast.textContent=m||'';toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){toast.classList.remove('show')},2200)}function folderRows(items){var map={'':{path:'',name:'全部材质',depth:0,count:0}};(items||[]).forEach(function(m){map[''].count++;var f=String(m.folder||'').replace(/\\/g,'/').replace(/^\/+|\/+$/g,'');if(!f)return;var p=f.split('/');for(var i=1;i<=p.length;i++){var path=p.slice(0,i).join('/');if(!map[path])map[path]={path:path,name:p[i-1],depth:i,count:0};map[path].count++}});return map}function isQuick(){return folder==='__recent__'||folder==='__favorites__'}function renderFolders(){var all=(state.material_library&&state.material_library.materials)||[],map=folderRows(all),keys=Object.keys(map).sort(function(a,b){if(a==='')return-1;if(b==='')return 1;return a.localeCompare(b,'zh-CN',{numeric:true})}),recent=all.filter(function(m){return Number(m.recent_at||0)>0}).length,fav=all.filter(function(m){return !!m.favorite}).length;folders.innerHTML='<div class="folder-title">快捷访问</div><div class="quick-group"><button class="folder-btn quick '+(folder==='__recent__'?'active':'')+'" data-folder="__recent__"><span>◷</span><span class="folder-name">最近常用</span><span class="folder-count">'+recent+'</span></button><button class="folder-btn quick '+(folder==='__favorites__'?'active':'')+'" data-folder="__favorites__"><span>★</span><span class="folder-name">收藏</span><span class="folder-count">'+fav+'</span></button></div><div class="folder-title">分类目录</div>'+keys.map(function(k){var f=map[k];return '<button class="folder-btn '+(folder===k?'active':'')+'" data-folder="'+esc(k)+'" style="padding-left:'+(8+f.depth*13)+'px"><span>'+(k?'▸':'⌂')+'</span><span class="folder-name">'+esc(f.name)+'</span><span class="folder-count">'+f.count+'</span></button>'}).join('')}function rows(){var all=(state.material_library&&state.material_library.materials)||[],qq=(search.value||'').toLowerCase(),list=all.slice();if(folder==='__recent__')list=list.filter(function(m){return Number(m.recent_at||0)>0}).sort(function(a,b){return Number(b.recent_at||0)-Number(a.recent_at||0)});else if(folder==='__favorites__')list=list.filter(function(m){return !!m.favorite});return list.filter(function(m){var path=String(m.folder||'').replace(/\\/g,'/').replace(/^\/+|\/+$/g,'');if(qq&&((m.name||'')+' '+path).toLowerCase().indexOf(qq)<0)return false;if(isQuick()||qq)return true;return !folder||path===folder||path.indexOf(folder+'/')===0})}function scopeName(){return folder==='__recent__'?'最近常用':(folder==='__favorites__'?'收藏':'当前分类')}function card(m,mini){var img='<img loading="lazy" src="'+esc(m.preview_url||'')+'">';if(mini)return '<div class="mini">'+img+'<div class="mini-name">'+esc(m.name)+'</div><button class="star '+(m.favorite?'favorite':'')+'" data-star="'+esc(m.id)+'">★</button></div>';return '<div class="card"><div class="swatch">'+img+'</div><div class="name">'+esc(m.name)+'</div><button class="star '+(m.favorite?'favorite':'')+'" data-star="'+esc(m.id)+'">★</button><div class="hover"><button class="btn" data-use="'+esc(m.id)+'" '+(state.material_library.can_use?'':'disabled')+'>'+(state.material_library.can_use?(state.material_library.selected_face_count>0?'应用到已选面':'启用油漆桶'):'进入建筑编辑后使用')+'</button></div></div>'}function renderMaterials(){var ml=state.material_library||{},rr=rows();q('materialCount').textContent=scopeName()+' '+rr.length+' · 总库 '+(((state.material_library||{}).materials)||[]).length;renderFolders();if(!ml.library_ready){grid.innerHTML='<div class="empty"><strong>尚未设置建筑材质库</strong>点击“设置目录”，选择材质 PNG 文件夹。</div>';return}if(!rr.length){var t=folder==='__recent__'?'暂无最近常用材质':(folder==='__favorites__'?'暂无收藏材质':'没有找到材质');grid.innerHTML='<div class="empty"><strong>'+t+'</strong>可选择一个有材质的面，再使用顶部吸管入库。</div>';return}grid.innerHTML=rr.map(function(m){return card(m,false)}).join('')}function renderSchedule(){var s=state.schedule||{};q('scheduleContent').innerHTML='<div class="schedule-card"><h3>建筑协同清单</h3><div class="kv"><span>当前状态</span><span>'+esc(s.status||'未连接')+'</span></div><div class="kv"><span>本地模型</span><span>'+esc(s.local_path||'未载入')+'</span></div><div class="kv"><span>共享模型</span><span>'+esc(s.shared_path||'未发布')+'</span></div><div class="kv"><span>载入与显示</span><span>'+esc((s.loaded?'已载入':'未载入')+' · '+(s.visible?'显示':'隐藏'))+'</span></div><div class="kv"><span>修改状态</span><span>'+esc(s.editing?'正在修改':(s.locked_by_other?((s.owner||'其他成员')+' 正在修改'):'未占用'))+'</span></div></div>'}function renderHeader(){q('version').textContent='SU LinkHub v'+(state.plugin_version||'0.9.87');var p=q('path'),c=q('choose'),r=q('refresh');if(tab==='material'){var ml=state.material_library||{};p.textContent=ml.library_root?'材质库：'+ml.library_root:'材质库：未设置';c.textContent='设置材质库';r.textContent='刷新材质';q('hint').textContent=ml.context_message||'可浏览建筑材质库。';q('status').textContent=ml.can_use?'可使用':'只读浏览'}else if(tab==='schedule'){p.textContent='建筑清单：协同模型状态';c.textContent='设置目录';r.textContent='刷新状态';q('hint').textContent='查看建筑协同模型、共享文件和占用状态。';q('status').textContent='状态清单'}else{p.textContent='建筑模型库：暂未启用';c.textContent='设置目录';r.textContent='刷新';q('hint').textContent='建筑模型库暂未启用；可切换到建筑材质库。';q('status').textContent='统一入口'}}function renderAll(){renderHeader();renderMaterials();renderSchedule()}document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x===b)});q('modelPane').classList.toggle('active',tab==='model');q('materialPane').classList.toggle('active',tab==='material');q('schedulePane').classList.toggle('active',tab==='schedule');if(tab==='material'&&!loaded){loaded=true;call('request_materials')}renderHeader()});folders.addEventListener('click',function(e){var b=e.target.closest('[data-folder]');if(b){folder=b.dataset.folder||'';renderMaterials()}});document.addEventListener('click',function(e){var b=e.target.closest('[data-star]');if(b){call('toggle_material_favorite',b.dataset.star);return}b=e.target.closest('[data-use]');if(b&&!b.disabled)call('use_material',b.dataset.use)});search.addEventListener('input',renderMaterials);q('choose').addEventListener('click',function(){if(tab==='material')call('choose_material_library')});q('refresh').addEventListener('click',function(){if(tab==='material')call('refresh_material_library');else call('ready')});window.ArchitectureLibrary={receiveState:function(n){n=n||{};Object.keys(n).forEach(function(k){if(k==='material_library'&&state.material_library)Object.assign(state.material_library,n[k]||{});else state[k]=n[k]});renderAll()},receiveMaterialState:function(n){state.material_library=n||{};state.material_library.materials=state.material_library.materials||[];loaded=true;renderAll()},showToast:function(p){showToast(p&&p.message||p||'')}};var a=0,t=setInterval(function(){a++;if(call('ready')||a>20)clearInterval(t)},150)})();
</script></body></html>
